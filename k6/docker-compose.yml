# k6 + QuickPizza + Prometheus + Grafana
# Levantar:  docker compose up -d
# Probar:    docker compose run --rm k6 run /scripts/01-smoke.js
# Grafana:   http://localhost:3000  (sin login)

services:
  # --- Sistema bajo prueba (SUT) ---
  quickpizza:
    image: ghcr.io/grafana/quickpizza-local:latest
    ports:
      - "3333:3333"
    # Limite de recursos: hace que la degradacion sea visible y reproducible
    # en cualquier laptop. Subir/bajar para experimentar.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # --- Almacen de metricas ---
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver # k6 empuja metricas aqui
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # --- Visualizacion ---
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/definitions/k6-prometheus.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # --- Generador de carga (se ejecuta bajo demanda) ---
  k6:
    image: grafana/k6:latest
    profiles: ["test"] # no arranca con "up"; solo con "run"
    environment:
      BASE_URL: http://quickpizza:3333
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),min,max,avg"
      K6_OUT: experimental-prometheus-rw
    volumes:
      - ./scripts:/scripts:ro
    command: run /scripts/01-smoke.js
    depends_on:
      - quickpizza
      - prometheus
