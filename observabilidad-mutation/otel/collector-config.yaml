receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Trazas -> Jaeger (vía OTLP)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Métricas -> endpoint que Prometheus raspa en :8889
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
